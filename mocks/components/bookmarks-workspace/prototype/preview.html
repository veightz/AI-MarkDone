.sidebar-module-button.active>svg{color:var(--aimd-accent)}.sidebar-module-button:hover{background:var(--aimd-card)}

.sidebar-panel-scroll .library-navigation{gap:3px}.sidebar-panel-scroll .library-nav-link{min-height:39px;padding:9px 12px;font-size:12px;border-radius:12px;transition:background .14s,color .14s}
.sidebar-panel-scroll .library-nav-link.active{box-shadow:none;background:var(--aimd-accent-soft);border-color:transparent}
.sidebar-panel-scroll .navigation-group+.navigation-group,.sidebar-panel-scroll .folder-navigation{margin-top:26px}
.sidebar-panel-scroll .navigation-label{font-size:9px;margin-bottom:8px}
.sidebar-panel-scroll .folder-nav-link{font-size:11px;min-height:36px}
.settings-sidebar-navigation .settings-nav-link{font-size:11px;min-height:40px;gap:9px}.settings-sidebar-navigation .settings-nav-link svg{width:16px;height:16px}
