<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-MarkDone Message Export</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; }
      main { padding: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
      button { font: inherit; padding: 8px 12px; }
    </style>
  </head>
  <body>
    <main>
      <button data-action="open-rich">Rich reply</button>
      <button data-action="open-plain">Plain reply</button>
      <button data-action="toggle-theme">Light / dark</button>
      <button data-action="toggle-locale">English / 中文</button>
      <span data-role="mock-status" role="status"></span>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
