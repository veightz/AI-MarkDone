<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI-MarkDone</title>
    <link rel="stylesheet" href="/src/popup/popup-tokens.css" />
    <style>
      :root { color-scheme: light; }
      :root[data-aimd-theme="dark"] { color-scheme: dark; }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        background: var(--aimd-workspace-surface);
        color: var(--aimd-text-primary);
        font-family: var(--aimd-font-family-sans);
      }

      body {
        padding: var(--aimd-space-4);
      }

      .popup-shell {
        display: grid;
        gap: var(--aimd-space-5);
        padding: var(--aimd-space-5);
      }

      .popup-header {
        display: grid;
        gap: var(--aimd-space-3);
      }

      .popup-brand {
        display: flex;
        align-items: center;
        gap: var(--aimd-space-3);
      }

      .popup-logo {
        width: calc(var(--aimd-size-control-icon-panel) + var(--aimd-space-2));
        height: calc(var(--aimd-size-control-icon-panel) + var(--aimd-space-2));
        border-radius: var(--aimd-radius-xl);
        border: 1px solid var(--aimd-border-default);
        background: color-mix(in srgb, var(--aimd-bg-surface) 80%, transparent);
      }

      .popup-title {
        margin: 0;
        font-size: var(--aimd-text-lg);
        line-height: 1.2;
        font-weight: var(--aimd-font-semibold);
      }

      .popup-note {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        min-height: 28px;
        padding: 0 var(--aimd-space-3);
        border-radius: var(--aimd-radius-full);
        background: var(--aimd-interactive-selected);
        color: var(--aimd-text-primary);
        font-size: var(--aimd-text-xs);
        font-weight: var(--aimd-font-semibold);
        letter-spacing: 0.01em;
      }

      .popup-links {
        display: grid;
        gap: var(--aimd-space-2);
      }

      .popup-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--aimd-space-3);
        min-height: calc(var(--aimd-space-6) + var(--aimd-space-5));
        padding: 0 var(--aimd-space-4);
        color: var(--aimd-text-primary);
        font-size: var(--aimd-text-sm);
        font-weight: var(--aimd-font-medium);
        text-decoration: none;
        transition:
          border-color var(--aimd-duration-fast) var(--aimd-ease-in-out),
          background var(--aimd-duration-fast) var(--aimd-ease-in-out),
          transform var(--aimd-duration-fast) var(--aimd-ease-in-out);
      }

      .popup-link__meta {
        display: grid;
        min-width: 0;
        gap: calc(var(--aimd-space-1) / 2);
      }

      .popup-link__label {
        font-size: var(--aimd-text-sm);
        font-weight: var(--aimd-font-semibold);
      }

      .popup-link__hint {
        color: var(--aimd-text-secondary);
        font-size: var(--aimd-text-xs);
        font-weight: 400;
        overflow-wrap: anywhere;
      }

      .popup-link__arrow {
        color: var(--aimd-text-secondary);
        font-size: var(--aimd-text-lg);
      }

      .popup-footer {
        display: grid;
        gap: var(--aimd-space-3);
        padding-top: var(--aimd-space-4);
        border-top: 1px solid var(--aimd-border-default);
      }

      .popup-footer__text {
        margin: 0;
        color: var(--aimd-text-secondary);
        font-size: var(--aimd-text-xs);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }

      @media (max-width: 360px) {
        body {
          padding: var(--aimd-space-2);
        }

        .popup-shell {
          gap: var(--aimd-space-4);
          padding: var(--aimd-space-4);
          border-radius: var(--aimd-radius-xl);
        }

        .popup-link {
          padding-inline: var(--aimd-space-3);
        }
      }

    </style>
  </head>
  <body>
    <main class="popup-shell aimd-material-surface">
      <section class="popup-header">
        <div class="popup-note" data-i18n="popupSupportedSites">Supported sites</div>
        <div class="popup-brand">
          <img class="popup-logo" src="/icons/icon48.png" alt="AI-MarkDone logo" data-i18n-attr="alt:popupLogoAlt" />
          <div class="popup-brand__copy">
            <h1 class="popup-title">AI-MarkDone</h1>
          </div>
        </div>
      </section>

      <section class="popup-links">
        <a class="popup-link aimd-material-button" href="https://chatgpt.com/" target="_blank" rel="noreferrer">
          <span class="popup-link__meta">
            <span class="popup-link__label">ChatGPT</span>
            <span class="popup-link__hint" data-i18n="popupChatGptHint">Read, annotate, bookmark, and export replies</span>
          </span>
          <span class="popup-link__arrow" aria-hidden="true">→</span>
        </a>
        <a class="popup-link aimd-material-button" href="https://gemini.google.com/" target="_blank" rel="noreferrer">
          <span class="popup-link__meta">
            <span class="popup-link__label">Gemini</span>
            <span class="popup-link__hint" data-i18n="popupFormulaCopyHint">Formula copy</span>
          </span>
          <span class="popup-link__arrow" aria-hidden="true">→</span>
        </a>
        <a class="popup-link aimd-material-button" href="https://claude.ai/" target="_blank" rel="noreferrer">
          <span class="popup-link__meta">
            <span class="popup-link__label">Claude</span>
            <span class="popup-link__hint" data-i18n="popupFormulaCopyHint">Formula copy</span>
          </span>
          <span class="popup-link__arrow" aria-hidden="true">→</span>
        </a>
        <a class="popup-link aimd-material-button" href="https://chat.deepseek.com/" target="_blank" rel="noreferrer">
          <span class="popup-link__meta">
            <span class="popup-link__label">DeepSeek</span>
            <span class="popup-link__hint" data-i18n="popupFormulaCopyHint">Formula copy</span>
          </span>
          <span class="popup-link__arrow" aria-hidden="true">→</span>
        </a>
      </section>

      <footer class="popup-footer">
        <p class="popup-footer__text" data-i18n="popupUnsupportedPageFooter">
          Open ChatGPT and use the toolbar below a reply. Click the extension icon for Library and Settings.
        </p>
      </footer>
    </main>
    <script src="/src/popup/popup.js"></script>
  </body>
</html>
